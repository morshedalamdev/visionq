services:
  db:
    image: ${PG_IMAGE:?set PG_IMAGE}
    environment:
      POSTGRES_DB: visionq
      POSTGRES_USER: visionq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a private database password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD"
          psql -X -h 127.0.0.1 -U visionq -d visionq
          -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' | grep -qx 1
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  worker:
    profiles: ["tools"]
    build: .
    image: visionq-m1t2-worker:local
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a private database password}
      ARTIFACT_ROOT: /artifacts
      VLLM_GENERATION_BASE_URL: ${VLLM_GENERATION_BASE_URL:?set generation URL}
      VLLM_EMBEDDING_BASE_URL: ${VLLM_EMBEDDING_BASE_URL:?set embedding URL}
    volumes:
      - ${ARTIFACT_DIR:?set artifact directory}:/artifacts
    networks:
      - backend
    restart: unless-stopped
  api:
    profiles: ["tools"]
    build: .
    image: visionq-m1t2-worker:local
    pull_policy: never
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a private database password}
      ARTIFACT_ROOT: /artifacts
      VISIONQ_ANALYTICS_API_TOKEN: ${VISIONQ_ANALYTICS_API_TOKEN:?set an API token}
      VISIONQ_UI_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      VLLM_GENERATION_BASE_URL: ${VLLM_GENERATION_BASE_URL:-}
      VLLM_EMBEDDING_BASE_URL: ${VLLM_EMBEDDING_BASE_URL:-}
    volumes:
      - ${ARTIFACT_DIR:?set artifact directory}:/artifacts
    ports:
      - 127.0.0.1:8000:8000
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
  mcp:
    profiles: ["tools"]
    build: .
    image: visionq-m1t2-worker:local
    pull_policy: never
    command: ["visionq-mcp"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      VISIONQ_MCP_DATABASE_URL: ${VISIONQ_MCP_DATABASE_URL:?set the read-only MCP database URL}
      VISIONQ_MCP_TOKEN: ${VISIONQ_MCP_TOKEN:?set the MCP bearer token}
      VISIONQ_MCP_HOST: 0.0.0.0
      VISIONQ_MCP_PORT: 8001
      VISIONQ_MCP_EMBEDDING_BACKEND: ${VISIONQ_MCP_EMBEDDING_BACKEND:-deterministic}
      VISIONQ_MCP_EMBEDDING_DIMENSIONS: ${VISIONQ_MCP_EMBEDDING_DIMENSIONS:-8}
      VLLM_EMBEDDING_BASE_URL: ${VLLM_EMBEDDING_BASE_URL:-}
      VLLM_EMBEDDING_MODEL: ${VLLM_EMBEDDING_MODEL:-}
      VLLM_EMBEDDING_REVISION: ${VLLM_EMBEDDING_REVISION:-}
      VLLM_EMBEDDING_DIMENSIONS: ${VLLM_EMBEDDING_DIMENSIONS:-}
      VLLM_EMBEDDING_QUERY_PREFIX: ${VLLM_EMBEDDING_QUERY_PREFIX:-}
      VLLM_EMBEDDING_DOCUMENT_PREFIX: ${VLLM_EMBEDDING_DOCUMENT_PREFIX:-}
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:

networks:
  backend:
    internal: true
