[build-system]
requires = ["hatchling==1.17.0"]
build-backend = "hatchling.build"

[project]
name = "visionq"
version = "0.1.0"
description = "Self-hosted industrial defect analysis research platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16,<2",
    "azure-identity>=1.20,<2",
    "azure-storage-blob>=12.25,<13",
    "defusedxml>=0.7.1,<0.8",
    "pillow>=13,<14",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
]

[project.scripts]
visionq = "worker.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]