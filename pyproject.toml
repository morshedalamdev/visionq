[build-system]
requires = ["hatchling==1.17.0"]
build-backend = "hatchling.build"

[project]
name = "visionq"
version = "0.1.0"
description = "Self-hosted industrial defect analysis research platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["typer>=0.16,<1"]

[project.scripts]
visionq = "worker.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]