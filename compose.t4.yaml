services:
  db:
    image: ${PG_IMAGE:?PG_IMAGE is required}
    environment:
      POSTGRES_DB: visionq_t4_test
      POSTGRES_USER: visionq_t4_test
      POSTGRES_PASSWORD: ${VISIONQ_T4_PASSWORD:?password required}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U visionq_t4_test -d visionq_t4_test
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
